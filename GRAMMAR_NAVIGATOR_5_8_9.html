const KEY='gnav_589_2026_v1';
const defaultProfile=()=>({progress:{},assessment:{}});
let db=load();let page='home',selectedGrade='all',selectedTopic='5-buyn',stage=0,questionIndex=0,answers={},showDiscovery=false,showProof=false,timerId=null,timerSeconds=30,toastTimer=null,showErrorAnswer={},localSearch='';
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.profiles&&v.group)return v;}catch(e){}return {active:'Оқушы-01',profiles:{'Оқушы-01':defaultProfile()},group:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){notify('Сақтау мүмкін болмады. Браузер жадын тексеріңіз.');}}
function profile(){if(!db.profiles[db.active])db.profiles[db.active]=defaultProfile();return db.profiles[db.active];}
function log(id){let p=profile();if(!p.progress[id])p.progress[id]={};return p.progress[id];}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function topic(id){return TOPICS.find(t=>t.id===id)||TOPICS[0];}
function tag(t){return `<span class="gradepill g${t.grade}">${t.grade}-сынып</span>`;}
function gradeCount(g){return TOPICS.filter(x=>x.grade===g).length;}
function studied(){return Object.values(profile().progress).filter(x=>x.studiedAt).length;}
function completed(){return Object.values(profile().progress).filter(x=>x.best===3).length;}
function dueCount(){return TOPICS.reduce((n,t)=>n+dueFor(t.id).length,0);}
function notify(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3000);}
function dateISO(x){let d=x?new Date(x):new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function plusDays(iso,n){let [y,m,d]=iso.slice(0,10).split('-').map(Number);let dt=new Date(y,m-1,d+n);return dateISO(dt);}
function dateKz(iso){if(!iso)return '—';let [y,m,d]=iso.split('-');return `${d}.${m}.${y}`;}
function dueFor(id){let l=log(id),today=dateISO();if(!l.studiedAt)return [];return [1,3,7,14].filter(n=>!((l.reviews||[]).includes(n))&&plusDays(l.studiedAt,n)<=today);}
function go(p){stopTimer();page=p;render();window.scrollTo({top:0,behavior:'auto'});}
function openTopic(id,s=0){selectedTopic=id;stage=s;questionIndex=0;answers={};showDiscovery=false;showProof=false;go('lesson');}
function navHTML(){document.getElementById('nav').innerHTML=MENU.map(([id,ico,title])=>`<button type="button" class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span><span class="ntxt">${title}</span></button>`).join('');}
function head(title,sub){return `<h1 class="titleline">${title}</h1><p class="subtitle">${sub}</p>`;}
function sec(title,sub='',act=''){return `<div class="section"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${act}</div>`;}
function gradeButtons(){return `<div class="filters">${[['all','Барлығы'],[5,'5-сынып'],[8,'8-сынып'],[9,'9-сынып']].map(([v,l])=>`<button class="filter ${selectedGrade===v?'selected':''}" onclick="setGrade('${v}')">${l}</button>`).join('')}</div>`;}
function setGrade(s){selectedGrade=s==='all'?'all':Number(s);render();}
function topicCards(limit=0){let arr=TOPICS.filter(t=>(selectedGrade==='all'||t.grade===selectedGrade)&&(!localSearch||(`${t.title} ${t.rule} ${t.label}`).toLowerCase().includes(localSearch.toLowerCase())));if(limit)arr=arr.slice(0,limit);return arr.length?`<div class="topics">${arr.map(t=>{let l=log(t.id);return `<article class="topic"><div class="row between">${tag(t)}<span class="chip">${esc(t.label)}</span></div><h3>${esc(t.title)}</h3><div class="desc">${esc(t.rule).slice(0,145)}…</div><div class="foot"><span class="small muted">${l.best!==undefined?'★ '+l.best+'/3 дұрыс':'3 тест • 5 қадам'}</span><button class="btn light tiny" onclick="openTopic('${t.id}')">Ашу →</button></div></article>`;}).join('')}</div>`:`<div class="empty"><strong>Ереже табылмады</strong>Іздеуді өзгертіп көріңіз.</div>`;}
function stepsRow(){return `<div class="stepgrid">${STAGES.map(([name,ico,desc,bg],i)=>`<div class="stepcard"><span class="stepNum" style="background:${bg}">${ico}</span><strong>${i+1}. ${name}</strong><p>${desc}</p></div>`).join('')}</div>`;}
function home(){return `<div class="hero"><div><span class="herotag">✦ ҚАЗАҚ ТІЛІ • 5 / 8 / 9-СЫНЫП</span><h2>Ережені жаттама.<br><em>Түсін. Қолдан. Дәлелде.</em></h2><p>Қазақ тілі грамматикасын бес қадам арқылы меңгер. Әр ережені күнделікті өмірде қолдан, қателерді түзет және жетістігіңді бақыла.</p><div class="actions"><button class="btn gold" onclick="go('topics')">Ережелер картасы ↗</button><button class="btn white" onclick="go('journey')">5 қадамды көру</button></div></div><div class="compassbox" aria-hidden="true"><div class="compassart"><span class="needle"></span><span class="mini-dot a"></span><span class="mini-dot b"></span></div></div></div>
${sec('Менің оқу панелім','Жетістіктер осы құрылғыда, таңдалған оқушы кодымен сақталады.')}
<div class="statgrid"><div class="stat"><div class="top">БАРЛЫҚ ЕРЕЖЕ <span class="circle">📚</span></div><div class="num">${TOPICS.length}</div><div class="sub">5, 8, 9-сыныптар</div></div><div class="stat"><div class="top">ҚАРАЛҒАН <span class="circle">🧭</span></div><div class="num">${studied()}</div><div class="sub">Алғашқы тест аяқталған</div></div><div class="stat"><div class="top">3/3 НӘТИЖЕ <span class="circle">✨</span></div><div class="num">${completed()}</div><div class="sub">Толық дұрыс орындалған</div></div><div class="stat"><div class="top">ҚАЙТАЛАУ КЕЗЕГІ <span class="circle">📆</span></div><div class="num">${dueCount()}</div><div class="sub">Мерзімі жеткен қадамдар</div></div></div>
${sec('Бес қадам — бір жүйе','Ережені мысалдан танып, практикада қолданып, дәлелдеуге дейін.')}${stepsRow()}
${sec('Ереже картасынан таңда','Мысалға бір тақырыпты ашып көріңіз.',`<button class="btn ghost tiny" onclick="go('topics')">Барлық 15 ереже →</button>`)}${topicCards(6)}
<div class="footnote">Бұл оқу құралы — педагогикалық идеяның цифрлық моделі. Нақты сыныптың бағалау нәтижелері автоматты түрде ойдан жасалмайды.</div>`;}
function topicsPage(){return `${head('Ережелер картасы','5, 8 және 9-сыныптарға арналған 15 тақырып. 8-сыныптағы кірме сөздер — тілдік сауаттылықты өмірлік мәтінмен байланыстыратын қосымша лексикалық модуль.')}
<div class="panel" style="margin-bottom:18px"><div class="row between wrap">${gradeButtons()}<input class="search" id="topicSearch" type="search" value="${esc(localSearch)}" placeholder="Ереже немесе тақырыпты іздеу..." oninput="searchTopics(this.value)" aria-label="Ережені іздеу"></div></div><div id="topicResults">${topicCards()}</div>`;}
function searchTopics(s){localSearch=s;document.getElementById('topicResults').innerHTML=topicCards();}
function journey(){return `${head('Бес қадамдық навигатор','Бір ережені меңгеру алгоритмі. Әр кезең сабақта да, үйде де қолданылады.')}${stepsRow()}
${sec('Модель қалай жұмыс істейді?')}
<div class="twoCol"><div class="panel"><h3>Сабақтағы үлгі</h3><p><b>Байқа:</b> «Күн суытты, сондықтан біз жылы киіндік» сөйлемін талда.</p><p><b>Түсін:</b> «Күн суытты» — себеп, «жылы киіндік» — салдар.</p><p><b>Есте сақта:</b> Себеп → салдар формуласын бекіт.</p><p><b>Қолдан:</b> Бір күнделікті шешімнің себебін сөйлеммен түсіндір.</p><p><b>Дәлелде:</b> Екі компонент арасындағы байланысты атап бер.</p></div><div class="panel"><h3>Қай сыныпқа қалай?</h3><p>🍀 <b>5-сынып:</b> үндестік, сөз мағынасы, синоним, антоним арқылы сауатты хабарлама.</p><p>✍️ <b>8-сынып:</b> сөйлем мүшелері, сөз тіркесі, кірме сөздер арқылы ақпараттық мәтін.</p><p>🧠 <b>9-сынып:</b> салалас түрлері арқылы пікір, дәлел, оқиғалардың логикалық байланысы.</p><button class="btn primary" onclick="go('topics')">Ережені таңдау →</button></div></div>`;}
function lesson(){let t=topic(selectedTopic),l=log(t.id),body='';let side=`<div class="panel"><div class="row between">${tag(t)}<span class="chip">${esc(t.label)}</span></div><h3 style="margin-top:16px">Ереже паспорты</h3><p><b>Анықтама:</b> ${esc(t.rule)}</p><div class="note"><b>Тірек формула</b><br>${esc(t.formula)}</div><p><b>Мысал:</b> ${esc(t.example)}</p><p><b>Өмірде:</b> ${esc(t.life)}</p><div class="hr"></div><button class="btn outline" onclick="printTopic('${t.id}')">🖨 Ереже картасын басып шығару</button><button class="btn light" onclick="copyTopicUrl('${t.id}')">🔗 QR үшін сілтеме</button><p class="tinyhint">QR-карта үшін сайт жарияланған соң әр ереженің веб-сілтемесін QR-генераторға енгізуге болады. Жергілікті файлға арналған QR басқа құрылғыда ашылмайды.</p></div>`;
if(stage===0)body=`<h3>🔎 Байқа — мысалдан заңдылықты тап</h3><p>Мысалдарды салыстыр. Алдымен анықтаманы ашпай, өз болжамыңды айт.</p><div class="quote">${esc(t.observe)}</div><div class="note warn" style="margin-top:14px"><b>Ойлан:</b> ${esc(t.discovery)}</div><div class="actions"><button class="btn light" onclick="showDiscovery=!showDiscovery;render()">${showDiscovery?'Түсіндірмені жасыру':'Түсіндірмені ашу'}</button><button class="btn primary" onclick="setStage(1)">Келесі қадам →</button></div>${showDiscovery?`<div class="note green" style="margin-top:14px">${esc(t.rule)}</div>`:''}`;
if(stage===1)body=`<h3>💡 Түсін — анықтаманы өз сөзіңмен айт</h3><p>Ережені түсінген соң қысқа тұжырым құрастыр.</p><div class="note"><b>Ереже:</b><br>${esc(t.rule)}</div><div class="quote" style="margin:14px 0">${esc(t.example)}</div><p class="small muted"><b>Қарсы мысал / ескерту:</b> ${esc(t.contrast)}</p><label class="pretitle" for="understandText">Өз түсіндірмем</label><textarea id="understandText" class="inputfield" placeholder="Мен бұл ережені былай түсіндім..." onblur="saveField('understand',this.value)">${esc(l.understand||'')}</textarea><div class="actions"><button class="btn primary" onclick="setStage(2)">Тірек сөздерге өту →</button></div>`;
if(stage===2)body=`<h3>🧠 Есте сақта — қысқа тірек</h3><p>Маңызды белгілерді жүйеле. Сосын оларды экранға қарамай еске түсір.</p><div class="formula">${esc(t.formula)}</div><div style="margin-top:17px">${t.cues.map((c,i)=>`<div class="cue">${i+1}. ${esc(c)}</div>`).join('')}</div><div class="note warn" style="margin-top:13px"><b>Есте сақта:</b> ${esc(t.example)}</div><div class="actions"><button class="btn primary" onclick="setStage(3)">Тестке өту →</button></div>`;
if(stage===3){let q=t.questions[questionIndex],a=answers[questionIndex],done=Object.keys(answers).length===3;body=`<div class="row between wrap"><h3>🧩 Қолдан — жылдам тест</h3><span class="chip">${questionIndex+1} / 3 сұрақ</span></div><div class="quizbox"><p class="pretitle">СҰРАҚ ${questionIndex+1}</p><h3>${esc(q.q)}</h3><div class="qopts">${q.options.map((o,i)=>`<button class="qopt ${a!==undefined?(i===q.answer?'correct':(i===a?'wrong':'')):''}" ${a!==undefined?'disabled':''} onclick="pick(${i})">${esc(o)} ${a!==undefined&&i===q.answer?'✓':''}</button>`).join('')}</div>${a!==undefined?`<div class="note ${a===q.answer?'green':'warn'}"><b>${a===q.answer?'Дұрыс!':'Қайта қарап көр.'}</b> ${esc(q.why)}</div>`:''}</div>
<div class="actions">${questionIndex>0?`<button class="btn outline" onclick="qGo(${questionIndex-1})">← Артқа</button>`:''}${questionIndex<2?`<button class="btn primary" ${a===undefined?'disabled':''} onclick="qGo(${questionIndex+1})">Келесі сұрақ →</button>`:`<button class="btn primary" ${!done?'disabled':''} onclick="finishQuiz()">Нәтижені сақтау ✓</button>`}<button class="btn ghost" onclick="retryQuiz()">Қайта бастау</button></div>
${l.best!==undefined?`<div class="note green" style="margin-top:13px">Үздік нәтиже: <b>${l.best}/3</b>. Осы тақырып бойынша қайталау жоспары іске қосылған.</div>`:''}<div class="hr"></div><h3>Өмірде қолдан</h3><p>${esc(t.life)}</p><div class="note warn"><b>Өмірлік тапсырма:</b> ${esc(t.prompt)}</div><textarea class="inputfield" style="margin-top:12px" placeholder="Жауабыңызды осында жазыңыз..." onblur="saveField('lifeAnswer',this.value)">${esc(l.lifeAnswer||'')}</textarea><p class="tinyhint">Еркін мәтінді жүйе автоматты тексермейді. Мұғалім немесе оқушы рубрика бойынша бағалайды.</p><button class="btn light" onclick="setStage(4)">Дәлелдеу кезеңіне өту →</button>`;}
if(stage===4)body=`<h3>🎯 Дәлелде — жауабыңды негізде</h3><p>Өз мысалыңды келтіріп, оның неге осы ережеге сәйкес келетінін түсіндір.</p><div class="quote">${esc(t.prompt)}</div><label class="pretitle" style="display:block;margin-top:18px">Менің дәлелім</label><textarea class="inputfield" placeholder="Бұл ереже қолданылады, себебі..." onblur="saveField('proofAnswer',this.value)">${esc(l.proofAnswer||'')}</textarea><div class="actions"><button class="btn outline" onclick="showProof=!showProof;render()">${showProof?'Үлгіні жасыру':'Дәлелдеу үлгісін көру'}</button><button class="btn primary" onclick="go('assess')">Бағалау парағы →</button></div>${showProof?`<div class="note green" style="margin-top:14px"><b>Дәлелдеу үлгісі:</b> ${esc(t.proof)}</div>`:''}<div class="hr"></div><h3>Өзін-өзі тексеру</h3><div class="tagrow"><span class="chip">✓ Ережені түсіндірдім</span><span class="chip">✓ Мысал келтірдім</span><span class="chip">✓ Жауабымды дәлелдедім</span></div>`;
return `<button class="breadcrumbbtn" onclick="go('topics')">← Барлық ережелер</button><div style="margin-top:12px">${tag(t)}</div><h1 class="titleline" style="margin:11px 0 7px">${esc(t.title)}</h1><p class="subtitle">Ережені 5 қадам арқылы меңгер және оны өмірлік тапсырмада қолдан.</p><div class="lessonbar">${STAGES.map(([name,ico],i)=>`<button onclick="setStage(${i})" class="${stage===i?'selected':''}">${ico} ${i+1}. ${name}</button>`).join('')}</div><div class="lessongrid"><div class="panel">${body}</div>${side}</div>`;}
function setStage(n){stage=n;render();window.scrollTo({top:0,behavior:'smooth'});}
function pick(n){answers[questionIndex]=n;render();}
function qGo(n){questionIndex=n;render();}
function retryQuiz(){questionIndex=0;answers={};render();}
function finishQuiz(){let t=topic(selectedTopic);if(Object.keys(answers).length!==3)return;let score=t.questions.reduce((s,q,i)=>s+(answers[i]===q.answer?1:0),0);let l=log(t.id);l.best=Math.max(l.best??0,score);if(!l.studiedAt)l.studiedAt=dateISO();l.lastQuiz=dateISO();save();notify(`Тест нәтижесі: ${score}/3. Қайталау жоспары сақталды.`);render();}
function saveField(key,val){log(selectedTopic)[key]=val;save();notify('Жазба сақталды');}
function errorsPage(){return `${head('Қатені тап — ережені дәлелде','Әр карточкада бір қате бар. Алдымен өзің түзет, содан кейін үлгімен салыстыр.')}
<div class="note warn" style="margin-bottom:20px">⚑ Бұл бөлімде тыныс белгісінен бөлек, қосымша жалғау, сөз мағынасы және грамматикалық тұжырымдағы қателер де кездеседі.</div><div class="topics">${TOPICS.map(t=>{let l=log(t.id);return `<div class="topic"><div class="row between">${tag(t)}<span class="chip">${l.errorSolved?'✓ Тексерілді':'Жаттығу'}</span></div><h3>${esc(t.title)}</h3><div class="note warn"><b>Қате нұсқа:</b><br>${esc(t.error)}</div><textarea class="inputfield" id="e-${t.id}" placeholder="Дұрыс нұсқасын жазыңыз..." style="min-height:75px">${esc(l.errorAttempt||'')}</textarea><div class="actions"><button class="btn primary tiny" onclick="checkError('${t.id}')">Тексеру</button><button class="btn outline tiny" onclick="revealError('${t.id}')">Үлгі жауап</button></div>${showErrorAnswer[t.id]?`<div class="note green"><b>Дұрыс нұсқа:</b> ${esc(t.correct)}<br><b>Неге?</b> ${esc(t.why)}</div>`:''}</div>`;}).join('')}</div>`;}
function norm(s){return String(s).normalize('NFC').toLowerCase().replace(/[«»“”"']/g,'').replace(/\s+/g,' ').replace(/\s*([,.!?;:])\s*/g,'$1 ').trim();}
function checkError(id){let t=topic(id),v=document.getElementById('e-'+id).value;log(id).errorAttempt=v;if(norm(v)===norm(t.correct)){log(id).errorSolved=true;save();notify('Тамаша! Жауап дұрыс.');showErrorAnswer[id]=true;render();}else{save();notify('Жауап үлгіге сәйкес келмейді. Тағы тексеріңіз немесе үлгіні ашыңыз.');}}
function revealError(id){let t=topic(id);log(id).errorAttempt=document.getElementById('e-'+id).value;showErrorAnswer[id]=!showErrorAnswer[id];save();render();}
function speakPage(){let t=topic(selectedTopic);return `${head('Ережені 30 секундта түсіндір','Ережені жатқа қайталау емес, негізгі белгілерін өз сөзіңмен айту — басты мақсат.')}
<div class="twoCol"><div class="panel"><div class="row between wrap"><h3>Тақырыпты таңда</h3>${tag(t)}</div><select class="inputfield" id="speakSelect" onchange="selectedTopic=this.value;stopTimer();timerSeconds=30;render()">${TOPICS.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.grade}-сынып • ${esc(x.title)}</option>`).join('')}</select><div class="note warn" style="margin-top:18px"><b>Тапсырма:</b> «${esc(t.title)}» ережесін 30 секунд ішінде түсіндір. Бір белгісін және бір мысалын келтір.</div><div class="hr"></div><h3>Бағалау өлшемдері</h3><div class="cue">✓ Ереже мазмұны дұрыс</div><div class="cue">✓ Негізгі белгісі аталды</div><div class="cue">✓ Мысал келтірілді</div><div class="cue">✓ Неге сәйкес келетінін дәлелдеді</div></div><div class="panel"><div class="timerbox"><div style="text-align:center"><div class="pretitle">ТҮСІНДІРУ УАҚЫТЫ</div><div class="timer" id="clock">${timerSeconds}</div><div class="muted">секунд</div></div></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="startTimer()">▶ Бастау</button><button class="btn outline" onclick="pauseTimer()">❚❚ Тоқтату</button><button class="btn ghost" onclick="resetTimer()">↺ Қайта қою</button></div><p class="tinyhint">Таймер құрылғының өзінде жұмыс істейді; дыбысы жазылмайды және серверге жіберілмейді.</p></div></div>`;}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function startTimer(){if(timerId||timerSeconds<=0)return;timerId=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);let x=document.getElementById('clock');if(x)x.textContent=timerSeconds;if(timerSeconds===0){stopTimer();notify('30 секунд аяқталды. Жауабыңды рубрикамен тексер.');}},1000);}
function pauseTimer(){stopTimer();}
function resetTimer(){stopTimer();timerSeconds=30;let x=document.getElementById('clock');if(x)x.textContent=30;}
function reviewPage(){let rows=TOPICS.map(t=>{let l=log(t.id);return `<tr><td>${tag(t)}<br><b style="display:inline-block;margin-top:5px">${esc(t.title)}</b></td>${[1,3,7,14].map(n=>{if(!l.studiedAt)return '<td><span class="muted">—</span></td>';let on=plusDays(l.studiedAt,n),done=(l.reviews||[]).includes(n),due=on<=dateISO();return `<td><div class="small">${done?'✅':due?'🟠':'📅'} ${dateKz(on)}</div>${done?'<span class="tinyhint">Өтті</span>':due?`<button class="btn tiny light" onclick="markReview('${t.id}',${n})">Өткізу</button>`:'<span class="tinyhint">Күтілуде</span>'}</td>`;}).join('')}</tr>`;}).join('');return `${head('1–3–7–14 қайталау навигаторы','Тестті бірінші рет аяқтаған күннен бастап 1, 3, 7 және 14 күннен кейін материалды қайта еске түсір.')}
<div class="note green" style="margin-bottom:19px"><b>Қайталау реті:</b> 1-күн — негізгі белгілер; 3-күн — өз мысалың; 7-күн — қатені түзету; 14-күн — жаңа мәтінде тауып, дәлелдеу. Бұл — ұсынылатын кесте, міндетті норма емес.</div><div class="panel"><div class="row between wrap"><h3>Менің қайталау күнтізбем</h3><span class="chip">Мерзімі келгені: ${dueCount()}</span></div><div class="tablewrap"><table class="dataTable"><thead><tr><th>Тақырып</th><th>1-күн</th><th>3-күн</th><th>7-күн</th><th>14-күн</th></tr></thead><tbody>${rows}</tbody></table></div><p class="tinyhint">Қайталауды «Өткізу» деп тек тапсырманы орындаған соң белгілеңіз. Егер тест әлі аяқталмаған болса, тақырыпты «Ережелер картасынан» бастаңыз.</p></div>`;}
function markReview(id,n){let l=log(id);if(!l.studiedAt)return;let on=plusDays(l.studiedAt,n);if(on>dateISO())return;if(!l.reviews)l.reviews=[];if(!l.reviews.includes(n))l.reviews.push(n);save();selectedTopic=id;notify(`${n}-күндік қайталау белгіленді. Тапсырманы орындауды ұмытпаңыз.`);render();}
function assessmentScore(v){return Array.isArray(v)?v.reduce((a,b)=>a+Number(b||0),0):0;}
function assessPage(){let a=profile().assessment;let phase=currentPhase();let v=a[phase]||[0,0,0,0,0,0];let sum=assessmentScore(v),pre=a.pre?assessmentScore(a.pre):null,post=a.post?assessmentScore(a.post):null,delay=a.delay?assessmentScore(a.delay):null;return `${head('Диагностикалық бағалау','Алты критерий бойынша 0–4 балл. Бұл — мұғалім немесе оқушы дәлелді жауаптарға сүйеніп толтыратын рубрика, автоматты түрде қойылатын баға емес.')}
<div class="split"><div class="panel"><div class="row between wrap"><h3>Бағалау парағы</h3><select class="inputfield" id="assessPhase" style="width:auto" onchange="switchPhase(this.value)"><option value="pre" ${phase==='pre'?'selected':''}>Бастапқы диагностика</option><option value="post" ${phase==='post'?'selected':''}>Қорытынды диагностика</option><option value="delay" ${phase==='delay'?'selected':''}>14 күннен кейін</option></select></div><p class="tinyhint">0 — орындалмаған; 1 — елеулі қателер; 2 — жартылай; 3 — негізінен дұрыс; 4 — толық, дұрыс, дербес орындалған.</p>${CRITERIA.map((c,i)=>`<div class="rubricRow"><label for="r${i}" style="font-size:13px">${esc(c)}</label><input id="r${i}" type="range" min="0" max="4" step="1" value="${Number(v[i]||0)}" oninput="updateRubric(${i},this.value)"><strong id="rv${i}">${Number(v[i]||0)}</strong></div>`).join('')}<div class="actions"><button class="btn primary" onclick="saveRubric()">Бағалауды сақтау</button><button class="btn outline" onclick="clearRubric()">Осы кезеңді тазалау</button></div></div>
<div><div class="scorecard"><div class="small" style="color:#d3e4ff">АҒЫМДАҒЫ НӘТИЖЕ</div><div class="big" id="scoreTotal">${sum} <span style="font-size:19px;font-weight:600">/ 24</span></div><div id="scorePercent" style="font-size:19px">${Math.round(sum/24*100)}%</div><p style="color:#d5e7fa;margin:15px 0 0">Әр дағдыны жеке бағалау мүмкіндік береді.</p></div><div class="panel" style="margin-top:15px"><h3>Бастапқы → Қорытынды</h3>${pre!==null||post!==null?`<div class="barlist">${CRITERIA.map((c,i)=>{let x=a.pre?a.pre[i]:0,y=a.post?a.post[i]:0;return `<div><div class="barlabel"><span>${esc(c)}</span><span>${x}/4 → ${y}/4</span></div><div class="barsplit"><div class="bartrack"><div class="barfill pre" style="width:${x*25}%"></div></div><div class="bartrack"><div class="barfill" style="width:${y*25}%"></div></div></div></div>`;}).join('')}</div><p class="tinyhint">Сол жақ сары: бастапқы. Оң жақ көк: қорытынды.</p>`:`<div class="empty">Алдымен бағалау нәтижелерін сақтаңыз.</div>`}<div class="hr"></div><div class="small">Бастапқы: <b>${pre===null?'—':pre+'/24'}</b> · Қорытынды: <b>${post===null?'—':post+'/24'}</b> · 14 күн: <b>${delay===null?'—':delay+'/24'}</b></div></div></div></div>`;}
let phaseVal='pre',draftRubric=null;
function currentPhase(){return phaseVal;}
function switchPhase(v){phaseVal=v;draftRubric=null;render();}
function updateRubric(i,v){if(!draftRubric)draftRubric=[...(profile().assessment[phaseVal]||[0,0,0,0,0,0])];draftRubric[i]=Number(v);document.getElementById('rv'+i).textContent=v;let s=assessmentScore(draftRubric);document.getElementById('scoreTotal').innerHTML=s+' <span style="font-size:19px;font-weight:600">/ 24</span>';document.getElementById('scorePercent').textContent=Math.round(s/24*100)+'%';}
function saveRubric(){if(!draftRubric)draftRubric=[...(profile().assessment[phaseVal]||[0,0,0,0,0,0])];profile().assessment[phaseVal]=draftRubric;draftRubric=null;save();notify('Бағалау парағы сақталды');render();}
function clearRubric(){delete profile().assessment[phaseVal];draftRubric=null;save();render();}
function teacherPage(){let g=db.group;let vals=g.filter(x=>x.post!==''&&x.pre!=='');let mean=(a,k)=>a.length?(a.reduce((s,x)=>s+Number(x[k]),0)/a.length).toFixed(1):'—';let byGrade=[5,8,9].map(grade=>{let a=vals.filter(x=>x.grade===grade);return `<tr><td><b>${grade}-сынып</b></td><td>${a.length}</td><td>${mean(a,'pre')}</td><td>${mean(a,'post')}</td><td>${a.length?(Number(mean(a,'post'))-Number(mean(a,'pre'))).toFixed(1):'—'}</td></tr>`;}).join('');return `${head('Мұғалім панелі','Нақты оқушы нәтижелерін жергілікті құрылғыда код бойынша енгізіп, топтық өзгерісті есептеуге арналған журнал.')}
<div class="note warn" style="margin-bottom:18px"><b>Маңызды:</b> демонстрациялық дерек енгізілмеген. Нәтиже тек өзіңіз нақты қосқан бағалардан есептеледі. Журнал басқа компьютерлермен синхрондалмайды және серверге жіберілмейді. Оқушының аты-жөнінің орнына аноним код қолданыңыз.</div>
<div class="panel"><h3>Оқушы нәтижесін енгізу</h3><form id="classForm" onsubmit="addEntry(event)"><div class="classgrid"><div class="field"><label>Оқушы коды</label><input name="code" maxlength="30" required placeholder="Мысалы: O-01"></div><div class="field"><label>Сынып</label><select name="grade"><option value="5">5-сынып</option><option value="8">8-сынып</option><option value="9">9-сынып</option></select></div><div class="field"><label>Бастапқы (0–24)</label><input name="pre" type="number" min="0" max="24" required placeholder="0–24"></div><div class="field"><label>Қорытынды (0–24)</label><input name="post" type="number" min="0" max="24" required placeholder="0–24"></div><div class="field"><label>14 күн (0–24)</label><input name="delay" type="number" min="0" max="24" placeholder="Міндетті емес"></div></div><div class="actions"><button class="btn primary" type="submit">+ Журналға қосу / жаңарту</button><button class="btn outline" type="button" onclick="exportCSV()">↓ CSV жүктеу</button><button class="btn ghost" type="button" onclick="exportBackup()">↓ JSON сақтық көшірме</button></div></form></div>
${sec('Топтық қорытынды','Бірдей критерийлер бойынша 24 балдық шкала. Өзгеріс — қорытынды және бастапқы орташа балдың айырмасы.')}
<div class="statgrid"><div class="stat"><div class="top">ЕНГІЗІЛГЕН <span class="circle">👥</span></div><div class="num">${g.length}</div><div class="sub">Код саны • мақсат: 25</div></div><div class="stat"><div class="top">БАСТАПҚЫ ОРТАША <span class="circle">🟠</span></div><div class="num">${mean(vals,'pre')}</div><div class="sub">24 балдан</div></div><div class="stat"><div class="top">ҚОРЫТЫНДЫ ОРТАША <span class="circle">🔵</span></div><div class="num">${mean(vals,'post')}</div><div class="sub">24 балдан</div></div><div class="stat"><div class="top">ОРТАША ӨЗГЕРІС <span class="circle">↗</span></div><div class="num">${vals.length?(Number(mean(vals,'post'))-Number(mean(vals,'pre'))).toFixed(1):'—'}</div><div class="sub">балл</div></div></div>
<div class="twoCol" style="margin-top:18px"><div class="panel"><h3>Сыныптар бойынша</h3><div class="tablewrap"><table class="dataTable"><thead><tr><th>Сынып</th><th>Саны</th><th>Бастапқы</th><th>Қорытынды</th><th>Δ балл</th></tr></thead><tbody>${byGrade}</tbody></table></div></div><div class="panel"><h3>Нәтижелер визуализациясы</h3>${vals.length?`<div class="barlist">${[5,8,9].map(k=>{let x=vals.filter(z=>z.grade===k);if(!x.length)return '';let a=+mean(x,'pre'),b=+mean(x,'post');return `<div><div class="barlabel"><span>${k}-сынып</span><span>${a}/24 → ${b}/24</span></div><div class="barsplit"><div class="bartrack"><div class="barfill pre" style="width:${a/24*100}%"></div></div><div class="bartrack"><div class="barfill" style="width:${b/24*100}%"></div></div></div></div>`;}).join('')}</div><p class="tinyhint">Сары — бастапқы. Көк — қорытынды.</p>`:'<div class="empty">Салыстыру үшін нақты балдарды енгізіңіз.</div>'}</div></div>
${sec('Оқушылар журналы','Аноним кодты сақтау ұсынылады.')}
<div class="panel"><div class="tablewrap"><table class="dataTable"><thead><tr><th>Код</th><th>Сынып</th><th>Бастапқы</th><th>Қорытынды</th><th>14 күн</th><th>Өзгеріс</th><th></th></tr></thead><tbody>${g.length?g.map((r,i)=>`<tr><td>${esc(r.code)}</td><td>${r.grade}</td><td>${r.pre}</td><td>${r.post}</td><td>${r.delay===''?'—':r.delay}</td><td>${r.post-r.pre>0?'+':''}${r.post-r.pre}</td><td><button class="btn tiny ghost" onclick="removeEntry(${i})">Жою</button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:25px;color:#8291a6">Әзірше нәтиже енгізілмеген.</td></tr>'}</tbody></table></div></div>
<div class="panel" style="margin-top:18px"><h3>Көп жазбаны жылдам енгізу</h3><p class="tinyhint">Әр жолға: код;сынып;бастапқы;қорытынды;14күн. Мысалы, өзіңіздің нақты деректеріңізді енгізіңіз. Бірінші тақырып жолы қажет емес. Әр балл 0–24 аралығында.</p><textarea class="inputfield" id="bulkEntries" rows="4" placeholder="O-01;5;...;...;...&#10;O-02;8;...;...;..."></textarea><div class="actions"><button class="btn outline" onclick="importBulk()">Жолдарды қосу</button></div></div>`;}
function cleanCode(s){return String(s||'').trim().replace(/[^0-9A-Za-zА-Яа-яӘәІіҢңҒғҮүҰұҚқӨөҺһ_.-]/g,'_').slice(0,30);}
function validScore(s,emptyAllowed=false){if(emptyAllowed&&(s===''||s===null||s===undefined))return '';if(!/^\d+$/.test(String(s).trim()))return null;let x=Number(s);return x>=0&&x<=24?x:null;}
function addGroupRecord(code,grade,pre,post,delay){code=cleanCode(code);grade=Number(grade);pre=validScore(pre);post=validScore(post);delay=validScore(delay,true);if(!code||![5,8,9].includes(grade)||pre===null||post===null||delay===null)return false;let key=code.toLocaleLowerCase('kk');let idx=db.group.findIndex(x=>x.code.toLocaleLowerCase('kk')===key&&x.grade===grade);let rec={code,grade,pre,post,delay};if(idx>=0)db.group[idx]=rec;else db.group.push(rec);return true;}
function addEntry(event){event.preventDefault();let d=new FormData(event.target);if(!addGroupRecord(d.get('code'),d.get('grade'),d.get('pre'),d.get('post'),d.get('delay'))){notify('Деректерді тексеріңіз: код, сынып, 0–24 балл.');return;}save();notify('Нәтиже сақталды');render();}
function removeEntry(i){if(!confirm('Осы жазбаны жою керек пе?'))return;db.group.splice(i,1);save();render();}
function importBulk(){let text=document.getElementById('bulkEntries').value;let ok=0,bad=0;for(let line of text.split(/\r?\n/)){if(!line.trim())continue;let s=line.split(/[;\t]/).map(x=>x.trim());if(s.length>=4&&addGroupRecord(s[0],s[1],s[2],s[3],s[4]??''))ok++;else bad++;}save();notify(`${ok} жазба қосылды. ${bad} жол қабылданбады.`);render();}
function download(name,text,type){let blob=new Blob(['\uFEFF',text],{type:type||'text/plain;charset=utf-8'});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportCSV(){let lines=[['Оқушы коды','Сынып','Бастапқы (24)','Қорытынды (24)','14 күн (24)','Өзгеріс'],...db.group.map(x=>[x.code,x.grade,x.pre,x.post,x.delay,x.post-x.pre])];download('grammar_navigator_natyzheleri.csv',lines.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function exportBackup(){download('grammar_navigator_saqtyq_koshirme.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');}
function importBackup(event){let f=event.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj.profiles||!Array.isArray(obj.group)||typeof obj.active!=='string')throw Error();if(!confirm('Сақтық көшірме ағымдағы деректерді алмастырады. Жалғастыру керек пе?'))return;db=obj;save();notify('Сақтық көшірме қалпына келтірілді');render();}catch(e){notify('Файлдың пішімі жарамсыз');}};r.readAsText(f);}
function profilePage(){return `${head('Оқушы кабинеті','Код бойынша жеке оқу нәтижесін ауыстыру, деректерді сақтау және қалпына келтіру.')}
<div class="twoCol"><div class="panel"><h3>Белсенді оқушы коды</h3><p class="muted small">Аты-жөнін пайдаланбаңыз. Бір компьютерде бірнеше оқушы жұмыс істесе, әрқайсысына бөлек код беріңіз.</p><input class="inputfield" id="profileCode" maxlength="30" value="${esc(db.active)}" placeholder="Мысалы: O-01"><div class="actions"><button class="btn primary" onclick="switchProfile()">Кодты таңдау</button></div><div class="hr"></div><div class="pretitle">ОСЫ ҚҰРЫЛҒЫДАҒЫ КОДТАР</div><div class="tagrow">${Object.keys(db.profiles).map(s=>`<button class="btn tiny ${s===db.active?'primary':'light'}" onclick="selectProfile('${esc(s).replaceAll('\\','\\\\').replaceAll("'","\\'")}')">${esc(s)}</button>`).join('')}</div></div><div class="panel"><h3>Деректер мен құпиялылық</h3><p>Деректер браузердің <b>localStorage</b> жадында қалады; серверге жіберілмейді. Браузер деректерін тазартқанда олар жойылуы мүмкін. Қалпына келтіру үшін JSON сақтық көшірмесін жүктеп алыңыз.</p><div class="actions"><button class="btn outline" onclick="exportBackup()">↓ Сақтық көшірме</button><label class="btn light" for="importFile" style="cursor:pointer">↑ Көшірмені ашу</label><input style="display:none" id="importFile" type="file" accept=".json,application/json" onchange="importBackup(event)"></div><p class="tinyhint">Бұл сайт желілік аккаунтсыз жұмыс істейді. Сынып нәтижелерін біріктіру үшін мұғалім бір журналға балдарды енгізеді немесе CSV файлдарын өзі жинақтайды.</p></div></div>`;}
function switchProfile(){let s=cleanCode(document.getElementById('profileCode').value);if(!s){notify('Кодты енгізіңіз.');return;}db.active=s;profile();save();notify('Оқушы коды таңдалды');render();}
function selectProfile(s){db.active=s;profile();save();render();}
function copyTopicUrl(id){if(!/^https?:$/.test(location.protocol)){notify('Алдымен HTML файлын сайтқа жариялаңыз: жергілікті файл сілтемесі QR арқылы басқа құрылғыда ашылмайды.');return;}let url=location.origin+location.pathname+'#topic='+encodeURIComponent(id);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>notify('Сілтеме көшірілді. QR-генераторға енгізіңіз.')).catch(()=>prompt('Сілтемені көшіріңіз:',url));}else{prompt('Сілтемені көшіріңіз:',url);}}
function printTopic(id){let t=topic(id);document.getElementById('printarea').innerHTML=`<div class="paper"><p style="letter-spacing:.13em;color:#56769d;font-weight:bold">GRAMMAR NAVIGATOR • ${t.grade}-СЫНЫП</p><h1>${esc(t.title)}</h1><div class="line"></div><h2>Ереже</h2><p>${esc(t.rule)}</p><h2>Есте сақта</h2><p><strong>${esc(t.formula)}</strong></p><p>${t.cues.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>')}</p><h2>Мысал</h2><p>${esc(t.example)}</p><h2>Өмірлік тапсырма</h2><p>${esc(t.prompt)}</p><h2>Жауабым</h2><div style="height:90px;border-bottom:1px dashed #99abc3"></div><h2>Дәлелім</h2><div style="height:80px;border-bottom:1px dashed #99abc3"></div><div style="margin-top:24px;display:flex;align-items:center;gap:16px"><div style="width:100px;height:100px;border:2px dashed #a6b8cf;display:grid;place-items:center;text-align:center;font-size:12px;color:#8a9cb6">QR-код<br>орны</div><p style="font-size:12px;color:#8291a5">QR-кодты сайт жарияланғаннан кейін жасалған нақты сілтемеден қосыңыз.</p></div><p style="font-size:12px;margin-top:25px;color:#8291a5">Байқа → Түсін → Есте сақта → Қолдан → Дәлелде</p></div>`;window.print();}
function render(){navHTML();document.getElementById('profileTag').textContent='◉ '+db.active;document.getElementById('crumb').textContent=MENU.find(x=>x[0]===page)?.[2]||'Ереже';let html={home,topics:topicsPage,journey,lesson,errors:errorsPage,speak:speakPage,review:reviewPage,assess:assessPage,teacher:teacherPage,profile:profilePage}[page]();document.getElementById('app').innerHTML=html;}
function routeHash(){let hash=location.hash.slice(1);if(hash.startsWith('topic=')){let id=decodeURIComponent(hash.slice(6));if(TOPICS.find(x=>x.id===id)){selectedTopic=id;page='lesson';stage=0;}}}
window.addEventListener('hashchange',()=>{routeHash();render();});
routeHash();render();
</script>
</body></html>
